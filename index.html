<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>츠캄몬스타즈 현황판</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2c;
      --text: #eef4ff;
      --muted: #9fb3ca;
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      --t3: linear-gradient(135deg, #ea580c, #ff8b3d);
      --t4: linear-gradient(135deg, #ca8a04, #facc15);
      --t5: linear-gradient(135deg, #16a34a, #4ade80);
      --t6: linear-gradient(135deg, #2563eb, #60a5fa);
      --t7: linear-gradient(135deg, #7c3aed, #a78bfa);
      --t8: linear-gradient(135deg, #475569, #94a3b8);
      --t9: linear-gradient(135deg, #ec4899, #f472b6);
      --leader: linear-gradient(135deg, #f59e0b, #fcd34d);
      --coach: linear-gradient(135deg, #059669, #34d399);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.18);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Inter", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(18, 112, 255, 0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.08), transparent 25%),
        linear-gradient(180deg, #04101d, #081321 35%, #07111f 100%);
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 10px 24px;
    }

    .hero {
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(10,24,43,.95), rgba(15,39,66,.92));
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 12px;
      margin-bottom: 6px;
    }

    .hero-top {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.1);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-copy h1 {
      font-size: 22px;
      margin: 0 0 4px;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .brand-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.4;
    }

    .tab-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      color: #dbeafe;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: .18s ease;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,.11);
    }

    .tab-btn.active {
      background: var(--accent-soft);
      border-color: rgba(96, 165, 250, .48);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(96,165,250,.18);
    }

    .summary-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .summary-card {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      min-height: 60px;
    }

    .summary-card .label {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .summary-card .value {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.03em;
      word-break: break-word;
      line-height: 1.15;
    }

    .summary-card .sub {
      color: var(--muted);
      margin-top: 2px;
      font-size: 10px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 8px;
    }

    .search-box, .filter-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .search-box {
      flex: 1 1 340px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      min-height: 36px;
    }

    .search-box input {
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      width: 100%;
      font-size: 12px;
    }

    .search-box input::placeholder { color: #7f95ae; }

    .filter-box select {
      min-height: 36px;
      border: 0;
      outline: none;
      background: var(--panel);
      color: var(--text);
      padding: 0 12px;
      font-size: 12px;
      min-width: 120px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0 6px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.02em;
    }

    .section-head .count {
      color: var(--muted);
      font-size: 13px;
    }

    .leaders-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .tier-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }

    .member-card {
      position: relative;
      background: linear-gradient(180deg, rgba(18,37,61,.95), rgba(10,23,39,.96));
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .member-banner {
      height: 46px;
      position: relative;
      background: linear-gradient(135deg, rgba(15,95,212,.85), rgba(15,139,255,.55));
    }

    .member-banner.t3 { background: var(--t3); }
    .member-banner.t4 { background: var(--t4); }
    .member-banner.t5 { background: var(--t5); }
    .member-banner.t6 { background: var(--t6); }
    .member-banner.t7 { background: var(--t7); }
    .member-banner.t8 { background: var(--t8); }
    .member-banner.t9 { background: var(--t9); }
    .member-banner.leader { background: var(--leader); }
    .member-banner.coach { background: var(--coach); }

    .badge-row {
      position: absolute;
      top: 7px;
      left: 7px;
      right: 7px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      z-index: 2;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .02em;
      background: rgba(4,13,24,.45);
      border: 1px solid rgba(255,255,255,.16);
      white-space: nowrap;
    }

    .chip.live { background: rgba(229,57,53,.24); color: #ffe0de; }
    .chip.offline { background: rgba(35,48,69,.72); color: #d1d9e6; }

    .chip.live,
    .chip.offline {
      min-height: 22px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 900;
    }

    .member-body {
      padding: 0 8px 8px;
      margin-top: -18px;
      position: relative;
      z-index: 1;
    }

    .avatar-wrap {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.12));
      box-shadow: 0 8px 18px rgba(0,0,0,.24);
      margin-bottom: 8px;
    }

    .avatar-wrap.live-border {
      background: linear-gradient(135deg, #ff4d4f, #ff7a7a);
      box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.25), 0 8px 18px rgba(255, 77, 79, 0.18);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 9px;
      object-fit: cover;
      background: #1d2d44;
    }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .name-row .name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.03em;
      min-width: 0;
      word-break: keep-all;
      line-height: 1.2;
    }

    .race-badge {
      flex-shrink: 0;
      font-size: 9px;
      padding: 3px 5px;
      border-radius: 6px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: #d7e2f0;
      white-space: nowrap;
    }

    .meta-list {
      display: grid;
      gap: 3px;
      margin-bottom: 8px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      color: #d9e3ef;
      font-size: 10px;
    }

    .meta-item .label { color: var(--muted); }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(54px, 1fr));
      gap: 4px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 26px;
      padding: 4px 4px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }

    .btn-stream { background: rgba(15,95,212,.22); }
    .btn-youtube { background: rgba(229,57,53,.18); }
    .btn-profile { background: rgba(255,255,255,.06); }

    .tier-section { margin-top: 8px; }

    .tier-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 8px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,.08);
    }

    .tier-title h3 {
      margin: 0;
      font-size: 12px;
      letter-spacing: -0.03em;
    }

    .tier-title p {
      margin: 0;
      font-size: 11px;
      color: rgba(255,255,255,.82);
    }

    .tier-title.t3 { background: var(--t3); }
    .tier-title.t4 { background: var(--t4); }
    .tier-title.t5 { background: var(--t5); }
    .tier-title.t6 { background: var(--t6); }
    .tier-title.t7 { background: var(--t7); }
    .tier-title.t8 { background: var(--t8); }
    .tier-title.t9 { background: var(--t9); }

    .empty {
      border: 1px dashed rgba(255,255,255,.14);
      border-radius: 16px;
      padding: 20px 14px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      font-size: 13px;
    }

    .screen { display: block; }
    .screen.hidden { display: none; }

    .notice-wrap {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .notice-card {
      background: linear-gradient(180deg, rgba(18,37,61,.95), rgba(10,23,39,.96));
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .notice-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .notice-head-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .notice-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.12);
      flex-shrink: 0;
      background: rgba(255,255,255,.06);
    }

    .notice-station-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .notice-station {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.16);
      border: 1px solid rgba(96,165,250,.22);
      color: #dbeafe;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .notice-time {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notice-summary-link {
      display: block;
      color: #d6e2f0;
      font-size: 12px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      text-decoration: none;
      transition: .15s ease;
    }

    .notice-summary-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .notice-meta {
      color: var(--muted);
      font-size: 11px;
      margin-top: 10px;
    }

    @media (max-width: 1180px) {
      .leaders-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .tier-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      .leaders-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tier-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .brand-copy h1 { font-size: 22px; }
    }

    @media (max-width: 768px) {
      .wrap {
        max-width: 100%;
        padding: 6px 6px 14px;
      }

      .hero {
        padding: 8px;
        border-radius: 10px;
      }

      .hero-top {
        gap: 8px;
      }

      .brand {
        gap: 8px;
        align-items: center;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
        border-radius: 10px;
      }

      .brand-copy h1 {
        font-size: 14px;
        line-height: 1.15;
        margin: 0 0 2px;
      }

      .brand-copy p {
        font-size: 9px;
        line-height: 1.2;
      }

      .tab-row {
        gap: 6px;
        margin-top: 4px;
      }

      .tab-btn {
        min-height: 24px;
        font-size: 9px;
        padding: 0 8px;
      }

      .summary-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 3px;
        margin-top: 5px;
      }

      .summary-card {
        padding: 4px;
        min-height: 34px;
        border-radius: 7px;
      }

      .summary-card .label {
        font-size: 6px;
        margin-bottom: 1px;
      }

      .summary-card .value {
        font-size: 9px;
      }

      .summary-card .sub {
        font-size: 5px;
        margin-top: 1px;
        line-height: 1.05;
      }

      .toolbar {
        gap: 4px;
        margin-bottom: 5px;
      }

      .search-box {
        min-height: 28px;
        padding: 0 8px;
      }

      .search-box input {
        font-size: 10px;
      }

      .filter-box select {
        min-height: 28px;
        min-width: 92px;
        font-size: 10px;
        padding: 0 8px;
      }

      .section-head {
        margin: 8px 0 4px;
      }

      .section-head h2 {
        font-size: 13px;
      }

      .section-head .count {
        font-size: 9px;
      }

      .leaders-grid,
      .tier-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }

      .member-card {
        border-radius: 10px;
      }

      .member-banner {
        height: 28px;
      }

      .badge-row {
        top: 4px;
        left: 4px;
        right: 4px;
        gap: 3px;
      }

      .chip {
        min-height: 12px;
        padding: 1px 4px;
        font-size: 6px;
      }

      .chip.live,
      .chip.offline {
        min-height: 16px;
        padding: 2px 6px;
        font-size: 8px;
      }

      .member-body {
        padding: 0 4px 4px;
        margin-top: -10px;
      }

      .avatar-wrap {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        margin-bottom: 3px;
      }

      .avatar {
        border-radius: 5px;
      }

      .name-row {
        gap: 3px;
        margin-bottom: 2px;
      }

      .name-row .name {
        font-size: 9px;
      }

      .race-badge {
        font-size: 6px;
        padding: 1px 3px;
        border-radius: 4px;
      }

      .meta-list {
        gap: 1px;
        margin-bottom: 3px;
      }

      .meta-item {
        font-size: 7px;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .btn-link {
        min-height: 16px;
        font-size: 7px;
        padding: 1px 2px;
        border-radius: 4px;
      }

      .tier-title {
        padding: 5px 6px;
        border-radius: 7px;
        margin-bottom: 4px;
      }

      .tier-title h3 {
        font-size: 11px;
      }

      .tier-title p {
        font-size: 7px;
      }
    }

    @media (max-width: 480px) {
      .wrap {
        padding: 8px 6px 18px;
      }

      .hero {
        padding: 10px;
        border-radius: 12px;
      }

      .brand {
        gap: 8px;
        align-items: flex-start;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 10px;
      }

      .brand-copy h1 {
        font-size: 16px;
      }

      .brand-copy p {
        font-size: 10px;
      }

      .tab-btn {
        min-height: 30px;
        font-size: 10px;
        padding: 0 10px;
      }

      .summary-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 3px;
      }

      .summary-card {
        padding: 5px;
        min-height: 38px;
        border-radius: 7px;
      }

      .summary-card .label {
        font-size: 6px;
        margin-bottom: 1px;
      }

      .summary-card .value {
        font-size: 10px;
        line-height: 1.05;
      }

      .summary-card .sub {
        font-size: 5px;
        margin-top: 1px;
        line-height: 1.1;
      }

      .toolbar {
        gap: 6px;
        margin-bottom: 6px;
      }

      .search-box,
      .filter-box {
        width: 100%;
      }

      .search-box {
        min-height: 34px;
        padding: 0 8px;
        border-radius: 10px;
      }

      .search-box input {
        font-size: 11px;
      }

      .filter-box select {
        width: 100%;
        min-height: 34px;
        font-size: 11px;
        padding: 0 8px;
      }

      .section-head {
        margin: 12px 0 6px;
      }

      .section-head h2 {
        font-size: 16px;
      }

      .section-head .count {
        font-size: 11px;
      }

      .leaders-grid,
      .tier-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }

      .member-card {
        border-radius: 8px;
      }

      .member-banner {
        height: 24px;
      }

      .badge-row {
        top: 3px;
        left: 3px;
        right: 3px;
        gap: 2px;
      }

      .chip {
        min-height: 11px;
        padding: 1px 3px;
        font-size: 5px;
      }

      .chip.live,
      .chip.offline {
        min-height: 15px;
        padding: 2px 5px;
        font-size: 7px;
      }

      .member-body {
        padding: 0 3px 3px;
        margin-top: -8px;
      }

      .avatar-wrap {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        margin-bottom: 2px;
      }

      .avatar {
        border-radius: 4px;
      }

      .name-row {
        margin-bottom: 2px;
        gap: 2px;
      }

      .name-row .name {
        font-size: 8px;
      }

      .race-badge {
        font-size: 5px;
        padding: 1px 2px;
        border-radius: 3px;
      }

      .meta-list {
        gap: 1px;
        margin-bottom: 2px;
      }

      .meta-item {
        font-size: 6px;
      }

      .links {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .btn-link {
        min-height: 14px;
        font-size: 6px;
        padding: 1px 2px;
        border-radius: 4px;
      }

      .tier-title {
        padding: 4px 6px;
        border-radius: 6px;
        margin-bottom: 4px;
      }

      .tier-title h3 {
        font-size: 10px;
      }

      .tier-title p {
        font-size: 6px;
      }

      .notice-card {
        padding: 7px;
        border-radius: 8px;
      }

      .notice-head {
        margin-bottom: 6px;
      }

      .notice-summary-link {
        font-size: 9px;
        line-height: 1.35;
      }

      .notice-avatar {
        width: 24px;
        height: 24px;
      }

      .notice-station {
        min-height: 18px;
        padding: 0 6px;
        font-size: 8px;
      }

      .notice-time,
      .notice-meta {

.analysis-winrate-fill {
  height: 100%;

.analysis-mobile-grid {

.analysis-mobile-card {

.analysis-sortable {

.analysis-sortable:hover {

.analysis-sort-indicator {

    function formatCheckedAt(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const mm = String(date.getMinutes()).padStart(2, "0");
      const ss = String(date.getSeconds()).padStart(2, "0");
      return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    }

    function parseNumber(value) {
      if (!value || value === "-") return 0;
      return Number(String(value).replace(/[^\d.-]/g, "")) || 0;
    }

    function parseMinutes(text) {
      if (!text) return 0;
      const hourMatch = String(text).match(/(\d+)\s*시간/);
      const minuteMatch = String(text).match(/(\d+)\s*분/);
      const hours = hourMatch ? Number(hourMatch[1]) : 0;
      const minutes = minuteMatch ? Number(minuteMatch[1]) : 0;
      return hours * 60 + minutes;
    }

    function formatMinutes(totalMinutes) {
      const minutes = Math.max(0, Math.round(totalMinutes));
      const hours = Math.floor(minutes / 60);
      const remain = minutes % 60;
      return `${hours}시간 ${remain}분`;
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString("ko-KR");

    function getMemberByUserId(userId) {
      return MEMBERS.find(member => member.userId === userId) || null;
    }

    function extractSoopUserId(url) {
      if (!url || url === "#") return null;
      const stationMatch = url.match(/sooplive\.com\/station\/([^/?#]+)/i);
      if (stationMatch) return stationMatch[1];
      const playMatch = url.match(/play\.sooplive\.com\/([^/?#]+)/i);
      if (playMatch) return playMatch[1];
      return null;
    }

    function mergeStatuses(list) {
      return list.map((member) => {
        const userId = member.userId || extractSoopUserId(member.stream || member.live);
        if (!userId) return member;
        return {
          ...member,
          status: liveStatusMap[userId] === true ? "live" : "offline"
        };
      });
    }

    function getFilteredMembers() {
      const q = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;
      const merged = mergeStatuses(MEMBERS);

      return merged.filter((member) => {
        const text = [member.name, member.role, member.race, member.type, member.tier ? `${member.tier}티어` : ""].join(" ").toLowerCase();
        const matchQuery = !q || text.includes(q);
        const matchStatus = status === "all" || member.status === status;
        return matchQuery && matchStatus;
      });
    }

      const total = list.length;

      summaryGrid.innerHTML = cards.map(card => `

          <div class="value">${card.value}</div>
          <div class="sub">${card.sub}</div>
        </div>
      `).join("");
    }

    function getLeaderCoachCategory(member) {

      if (["박준오", "박수범", "사테"].includes(member.name)) return "King";
      if (member.name === "파도튜브") return "Spade";
      return "";
    }


    function formatJoinDateText(name) {
      const value = JOIN_DATES[name];
      if (!value) return "-";

      const [year, month, day] = value.split("-").map(Number);
      const joinDate = new Date(year, month - 1, day);
      const today = new Date();
      const todayDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const diffDays = Math.floor((todayDate - joinDate) / 86400000);
      const yy = String(year).slice(2);
      const mm = String(month).padStart(2, "0");
      const dd = String(day).padStart(2, "0");
      const dText = diffDays >= 0 ? `D+${diffDays}` : `D${diffDays}`;

      return `${yy}.${mm}.${dd}(${dText})`;
    }

    function createMemberCard(member) {

      const category = (member.type === "leader" || member.type === "coach") ? getLeaderCoachCategory(member) : "";
      const joinDateText = formatJoinDateText(member.name);
      const liveLink = member.live && member.live !== "#" ? member.live : member.stream;
      const streamButtonLink = member.stream;

      return `

            <div class="name-row">

            </div>
          </div>
        </article>
      `;
    }

    function renderPlayers(list) {
      const players = list.filter((m) => m.type === "player");
      playerCount.textContent = `${players.length}명`;

      const groups = players.reduce((acc, cur) => {
        if (!acc[cur.tier]) acc[cur.tier] = [];
        acc[cur.tier].push(cur);
        return acc;
      }, {});

      const tiers = [3, 4, 5, 6, 7, 8, 9];
      tierBoard.innerHTML = tiers.map((tier) => {
        const items = groups[tier] || [];
        return `
          <section class="tier-section">

        `;
      }).join("");
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")

        return `
          <article class="notice-card">
            <div class="notice-head">
              <div class="notice-head-left">
                ${profileImage ? `<img class="notice-avatar" src="${profileImage}" alt="${escapeHtml(item.stationName || item.writer || "공지")} 프로필">` : ""}
                <div class="notice-station-wrap">
                  <span class="notice-station">${escapeHtml(item.stationName || item.writer || "공지")}</span>
                </div>
              </div>
              <span class="notice-time">${escapeHtml(item.time || "날짜 없음")}</span>
            </div>
            <a class="notice-summary-link" href="${safeLink(item.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.summary || "")}</a>
            <div class="notice-meta">최종 갱신: ${formatCheckedAt(lastNoticeCheckedAt)}</div>
          </article>
        `;
      }).join("");
    }

    function getAnalysisRole(member) {
      if (!member) return "-";
      return member.type === "player" ? `${member.tier}티어 ${member.race}` : `${member.role} · ${member.race}`;
    }

    function getAnalysisSortedItems(items) {
      const list = [...items];
      if (!analysisSortState.key) return list;

      const getters = {
        poong: (item) => parseNumber(item.monthlyPoong),
        viewers: (item) => parseNumber(item.monthlyViewers),
        time: (item) => parseMinutes(item.monthlyBroadcastTime),
        winrate: (item) => parseFloat(String(item.monthlyWinRate || '').replace('%', '')) || 0
      };

      const getter = getters[analysisSortState.key];
      if (!getter) return list;
      return list.sort((a, b) => getter(b) - getter(a));
    }

    function getWinrateClass(rate) {
      const value = parseFloat(String(rate || '').replace('%', ''));
      if (Number.isNaN(value)) return '';
      return value >= 50 ? 'good' : 'bad';
    }

    function getWinrateColor(rate) {
      const value = parseFloat(String(rate || '').replace('%', ''));
      if (Number.isNaN(value)) return '#64748b';
      if (value >= 70) return '#84cc16';
      if (value >= 50) return '#facc15';
      return '#fb7185';
    }

    function getRankBadgeClass(index) {
      if (index === 0) return 'rank-1';
      if (index === 1) return 'rank-2';
      if (index === 2) return 'rank-3';
      return '';
    }

    function updateAnalysisSortIndicators() {
      analysisSortableHeaders.forEach((th) => {
        const key = th.dataset.sortKey;
        const indicator = th.querySelector('.analysis-sort-indicator');
        th.classList.remove('is-desc');
        if (analysisSortState.key === key) {
          th.classList.add('is-desc');
          if (indicator) indicator.textContent = '↓';
        } else if (indicator) {
          indicator.textContent = '';
        }
      });
    }

    function buildAnalysisSummary(items) {
      const totalMinutes = items.reduce((sum, item) => sum + parseMinutes(item.monthlyBroadcastTime), 0);
      const totalViewers = items.reduce((sum, item) => sum + parseNumber(item.monthlyViewers), 0);
      const totalPoong = items.reduce((sum, item) => sum + parseNumber(item.monthlyPoong), 0);
      const validRates = items
        .map(item => parseFloat(String(item.monthlyWinRate || '').replace('%', '')))
        .filter(v => !Number.isNaN(v));
      const avgRate = validRates.length ? `${(validRates.reduce((a, b) => a + b, 0) / validRates.length).toFixed(1)}%` : '-';

      const cards = [
        { theme: 'blue', icon: '⏰', title: '총 월간 방송시간', value: formatMinutes(totalMinutes), sub: '', hint: '월간 기준' },
        { theme: 'purple', icon: '👤', title: '총 월간 시청자', value: `${formatNumber(totalViewers)}명`, sub: '', hint: '누적 합산' },
        { theme: 'gold', icon: '🌟', title: '총 월간 풍', value: `${formatNumber(totalPoong)}개`, sub: '', hint: '월간 데이터' },
        { theme: 'teal', icon: '🏆', title: '월간 평균 승률', value: avgRate, sub: '', hint: '월간 전적' }
      ];

      analysisTopGrid.innerHTML = cards.map(card => `
        <div class="analysis-top-card ${card.theme}">
          <div class="analysis-top-head">
            <div class="analysis-top-icon">${card.icon}</div>
            <div class="analysis-top-title">${card.title}</div>
          </div>
          <div class="value">${card.value}</div>
          <div class="analysis-top-foot">
            <div class="sub">${card.sub}</div>
            <div class="hint">${card.hint}</div>
          </div>
        </div>
      `).join('');
    }

    function renderAnalysisGroup(items, tableBodyEl, mobileGridEl, emptyLabel) {
      if (!items.length) {
        tableBodyEl.innerHTML = `<tr><td colspan="6"><div class="empty">${emptyLabel}</div></td></tr>`;
        mobileGridEl.innerHTML = `<div class="empty">${emptyLabel}</div>`;
        return;
      }

      tableBodyEl.innerHTML = items.map((item, index) => {
        const member = getMemberByUserId(item.userId);
        const roleText = getAnalysisRole(member);
        const rateClass = getWinrateClass(item.monthlyWinRate);
        const rateValue = parseFloat(String(item.monthlyWinRate || '').replace('%', '')) || 0;
        const rateColor = getWinrateColor(item.monthlyWinRate);
        const rankClass = getRankBadgeClass(index);
        return `
          <tr>
            <td>
              <div class="analysis-player-cell">
                <div class="analysis-rank-badge ${rankClass}">${index + 1}</div>
                <img class="analysis-avatar" src="${member?.profileImage || ''}" alt="${escapeHtml(item.name)} 프로필" />
                <div class="analysis-player-meta">
                  <div class="analysis-player-name">${escapeHtml(item.name)}</div>
                  <div class="analysis-player-sub">${escapeHtml(roleText)}</div>
                </div>
              </div>
            </td>
            <td>${escapeHtml(item.monthlyBroadcastTime || '-')}</td>
            <td>${escapeHtml(item.monthlyViewers || '-')}</td>
            <td>${escapeHtml(item.monthlyPoong || '-')}</td>
            <td>${escapeHtml(item.monthlyRecord || '-')}</td>
            <td>
              <div class="analysis-winrate-wrap">
                <div class="analysis-winrate ${rateClass}">${escapeHtml(item.monthlyWinRate || '-')}</div>
                <div class="analysis-winrate-bar"><div class="analysis-winrate-fill" style="width:${Math.max(0, Math.min(100, rateValue))}%; background:${rateColor};"></div></div>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      mobileGridEl.innerHTML = items.map((item, index) => {
        const member = getMemberByUserId(item.userId);
        const roleText = getAnalysisRole(member);
        const rateClass = getWinrateClass(item.monthlyWinRate);
        const rateValue = parseFloat(String(item.monthlyWinRate || '').replace('%', '')) || 0;
        const rateColor = getWinrateColor(item.monthlyWinRate);
        return `
          <article class="analysis-mobile-card">
            <div class="analysis-mobile-top">
              <div class="analysis-name-box">
                <div class="analysis-rank-badge ${getRankBadgeClass(index)}">${index + 1}</div>
                <img class="analysis-avatar" src="${member?.profileImage || ''}" alt="${escapeHtml(item.name)} 프로필" />
                <div>
                  <div class="analysis-player-name">${escapeHtml(item.name)}</div>
                  <div class="analysis-player-sub">${escapeHtml(roleText)}</div>
                </div>
              </div>
              <div class="analysis-rank">${index + 1}위</div>
            </div>
            <div class="analysis-mobile-stats">
              <div class="analysis-mobile-stat"><div class="label">방송시간</div><div class="value">${escapeHtml(item.monthlyBroadcastTime || '-')}</div></div>
              <div class="analysis-mobile-stat"><div class="label">월간 시청자</div><div class="value">${escapeHtml(item.monthlyViewers || '-')}</div></div>
              <div class="analysis-mobile-stat"><div class="label">월간 풍</div><div class="value">${escapeHtml(item.monthlyPoong || '-')}</div></div>
              <div class="analysis-mobile-stat"><div class="label">월간 전적</div><div class="value">${escapeHtml(item.monthlyRecord || '-')}</div></div>
              <div class="analysis-mobile-stat"><div class="label">승률</div><div class="value analysis-winrate ${rateClass}">${escapeHtml(item.monthlyWinRate || '-')}</div><div class="analysis-winrate-bar" style="margin-top:6px;"><div class="analysis-winrate-fill" style="width:${Math.max(0, Math.min(100, rateValue))}%; background:${rateColor};"></div></div></div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderAnalysis() {
      if (!analysisItems.length) {
        analysisCount.textContent = '0명';
        analysisWomenCount.textContent = '0명';
        analysisMenCount.textContent = '0명';
        analysisCheckedAt.textContent = '최종 갱신: -';
        analysisTopGrid.innerHTML = `<div class="empty">분석 데이터가 없습니다.</div>`;
        renderAnalysisGroup([], analysisWomenTableBody, analysisWomenMobileGrid, '여자 분석 데이터가 없습니다.');
        renderAnalysisGroup([], analysisMenTableBody, analysisMenMobileGrid, '남자 분석 데이터가 없습니다.');
        updateAnalysisSortIndicators();
        return;
      }

      const womenItems = getAnalysisSortedItems(analysisItems.filter(item => item.gender === 'women'));
      const menItems = getAnalysisSortedItems(analysisItems.filter(item => item.gender === 'men'));
      analysisCount.textContent = `${analysisItems.length}명`;
      analysisWomenCount.textContent = `${womenItems.length}명`;
      analysisMenCount.textContent = `${menItems.length}명`;
      analysisCheckedAt.textContent = `최종 갱신: ${formatCheckedAt(lastAnalysisCheckedAt)}`;
      buildAnalysisSummary(analysisItems);
      renderAnalysisGroup(womenItems, analysisWomenTableBody, analysisWomenMobileGrid, '여자 분석 데이터가 없습니다.');
      renderAnalysisGroup(menItems, analysisMenTableBody, analysisMenMobileGrid, '남자 분석 데이터가 없습니다.');
      updateAnalysisSortIndicators();
    }

    function showMainScreen() {
      tabMain.classList.add('active');
      tabNotice.classList.remove('active');
      tabAnalysis.classList.remove('active');
      mainScreen.classList.remove('hidden');
      noticeScreen.classList.add('hidden');
      analysisScreen.classList.add('hidden');
    }

    function showNoticeScreen() {
      tabMain.classList.remove('active');
      tabNotice.classList.add('active');
      tabAnalysis.classList.remove('active');
      mainScreen.classList.add('hidden');
      noticeScreen.classList.remove('hidden');
      analysisScreen.classList.add('hidden');
      renderNotices();
    }

    function showAnalysisScreen() {
      tabMain.classList.remove('active');
      tabNotice.classList.remove('active');
      tabAnalysis.classList.add('active');
      mainScreen.classList.add('hidden');
      noticeScreen.classList.add('hidden');
      analysisScreen.classList.remove('hidden');
      renderAnalysis();
      fetchAnalysis();
    }

    async function fetchLiveStatus() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(LIVE_STATUS_URL, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data && data.statuses) {
          liveStatusMap = data.statuses || {};
          lastCheckedAt = data.checkedAt || TEAM.updatedAt;
        }
      } catch (error) {
        if (error.name !== 'AbortError') console.log('라이브 상태 가져오기 실패', error);
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function fetchNotices() {
      try {
        const response = await fetch(`${NOTICE_JSON_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        noticeItems = Array.isArray(data.items) ? data.items : [];
        lastNoticeCheckedAt = data.checkedAt || '';
        renderNotices();
      } catch (error) {
        console.log('공지 데이터 가져오기 실패', error);
        noticeItems = [];
        renderNotices();
      }
    }

    async function fetchAnalysis() {
      try {
        const response = await fetch(`${ANALYSIS_JSON_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        analysisItems = Array.isArray(data.items) ? data.items : [];
        lastAnalysisCheckedAt = data.checkedAt || '';
        renderAnalysis();
      } catch (error) {
        console.log('분석 데이터 가져오기 실패', error);
      }
    }

    async function refreshLiveStatuses() {
      await fetchLiveStatus();
      render();
    }

    initHeader();
    render();
    renderNotices();
    renderAnalysis();
    refreshLiveStatuses();
    fetchNotices();
    fetchAnalysis();

    setInterval(refreshLiveStatuses, 20000);
    setInterval(fetchNotices, 30000);
    setInterval(fetchAnalysis, 300000);

    analysisSortableHeaders.forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.sortKey;
        if (!key) return;
        analysisSortState.key = key;
        renderAnalysis();
      });
    });
    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    tabMain.addEventListener("click", showMainScreen);
    tabNotice.addEventListener("click", showNoticeScreen);
    tabAnalysis.addEventListener("click", showAnalysisScreen);
  </script>
